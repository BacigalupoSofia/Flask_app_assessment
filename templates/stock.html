{% extends "base.html" %} {% block title %} Stock - Dental Inventory App {%
endblock %} {% block content %}

<table>
  <caption>
    Stock List
  </caption>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Brand</th>
      <th>Quantity</th>
    </tr>
  </thead>

  <tbody>
    {% for product in products %}
    <tr>
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.brand }}</td>
      <td>{{ product.quantity }}</td>

      <td>
        <a href="#"> Edit </a>
        |
        <a href="#"> Delete </a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<button><a href="#">Add Product</a></button>
{% endblock %}
