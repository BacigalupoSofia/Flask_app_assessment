<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Dental Inventory App {% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/style_home.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/style_delete.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Logo"
        class="image"
      />
      <div>
        <h1>Dental Inventory App</h1>
        <p>The solution for managing dental inventory</p>
      </div>

      <nav>
        <a href="{{ url_for('Home') }}"> Home </a>
        <a href="#">My Account</a>
      </nav>
    </header>

    <main class="content">{% block content %}{% endblock %}</main>

    <footer>
      <p>&copy; 2026 Dental Inventory App. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
