{% extends "base.html" %} {% block title %} Add Product - Dental Inventory App
{% endblock %} {% block content %} {% if errors %}
<div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
  <strong>Missing information!</strong>
  {% for err in errors %} {{ err }} {% endfor %}
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="alert"
    aria-label="Close"
  ></button>
</div>
{% endif %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4 text-center">
            Add a New Product to your Inventory
          </h2>

          <form method="POST" id="addForm">
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" name="category" class="form-select">
                <option value="" selected disabled>
                  -- Select a category --
                </option>
                <option value="Protection_and_consumables">
                  Protection and Consumables
                </option>
                <option value="Restorative">Restorative</option>
                <option value="Surgery">Surgery</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                value="{{ request.form.get('name', '') }}"
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label for="brand" class="form-label">Brand</label>
              <input
                type="text"
                id="brand"
                name="brand"
                value="{{ request.form.get('brand', '') }}"
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label for="Supplier" class="form-label">Supplier</label>
              <select id="Supplier" name="supplier" class="form-select">
                <option value="" selected disabled>
                  -- Select a supplier --
                </option>
                <option value="DMI">DMI</option>
                <option value="Dontalia">Dontalia</option>
                <option value="HenrySchein">Henry Schein</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label"> Description </label>
              <textarea
                id="description"
                name="description"
                rows="4"
                class="form-control"
              >
{{ request.form.get('description', '') }}</textarea
              >
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="quantity" class="form-label"> Quantity </label>
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  value="{{ request.form.get('quantity', '') }}"
                  class="form-control"
                />
              </div>

              <div class="col-md-6">
                <label for="minimum" class="form-label">
                  Minimum Quantity
                </label>
                <input
                  type="number"
                  id="minimum"
                  name="minimum"
                  value="{{ request.form.get('minimum', '') }}"
                  class="form-control"
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="expiry_date" class="form-label">
                Expiration Date
              </label>
              <input
                type="date"
                id="expiry_date"
                name="expiry_date"
                value="{{ request.form.get('expiry_date', '') }}"
                class="form-control"
              />
            </div>

            <div class="custom-file mb-4">
              <input
                type="file"
                class="custom-file-input"
                id="customFile"
                name="image"
              />
              <label class="custom-file-label" for="customFile"
                >Choose file</label
              >
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Add Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
